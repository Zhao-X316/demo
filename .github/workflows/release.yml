name: Release Build

# 产出可下载安装包：Windows (.msi/.exe) + macOS (.app/.dmg)。
# 触发：手动(workflow_dispatch) 或 打 tag v*。安装包作为 artifacts 上传，未签名。

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            src-tauri -> ../target

      - name: Install frontend deps
        run: npm ci

      - name: Generate app icons
        run: npm run tauri -- icon assets/icon.png

      # tauri build 会先跑 beforeBuildCommand(npm run build) 再编译+打包
      - name: Build installers
        env:
          # macOS 下显式跳过易受锁屏/无 GUI 影响的 Finder AppleScript。
          CI: true
        run: npm run tauri -- build

      - name: Verify macOS DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          shopt -s nullglob
          dmg_files=(target/release/bundle/dmg/JiaofuSuite_*.dmg)
          test "${#dmg_files[@]}" -eq 1
          bash scripts/verify_macos_dmg.sh "${dmg_files[0]}"

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: jiaofu-suite-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
          if-no-files-found: error
